<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ludii Game Client</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #controls, #game-area { margin-bottom: 20px; padding: 10px; background-color: #fff; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        #game-area { display: flex; flex-direction: column; align-items: center; }
        canvas { border: 1px solid black; }
        input[type="text"], input[type="password"] { margin-right: 5px; padding: 5px; }
        button { padding: 5px 10px; }
        #jwt-display { margin-top: 10px; word-break: break-all; font-size: 0.8em; color: #555; max-width: 300px; }
        #ws-status { margin-top: 10px; font-style: italic; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login-section">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" value="userws1">
        <input type="password" id="password" placeholder="Password" value="passwordws1">
        <button id="loginButton">Login</button>
        <div id="login-status" style="color: red; margin-top: 5px;"></div>
        <div id="jwt-display">JWT: (Not logged in)</div>
    </div>

    <div id="game-controls-section" class="hidden">
        <h2>Game Connection</h2>
        <input type="text" id="gameIdInput" placeholder="Enter Game ID">
        <button id="connectWsButton">Connect to Game WebSocket</button>
        <div id="ws-status">WebSocket: Not Connected</div>
         <p><em>(After connecting via WebSocket, click cells on the board to make moves)</em></p>
    </div>

    <div id="game-area">
        <h1 id="game-title">Ludii Game</h1>
        <div id="pixi-canvas-container"></div>
        <p id="status-message">Please login and connect to a game.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.0/pixi.min.js"></script>

    <script src="js/components.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
